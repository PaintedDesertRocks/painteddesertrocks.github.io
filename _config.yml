description: We pray to the old and new gods of Rock and Metal. In their realm there is no best and no worst; there is only Music. We are mere acolytes, sharing our stories so they may live on through our listeners, carrying forward the eternal urge to rock.
url: "https://painteddesertrocks.github.io"
baseurl: ""     # keep empty for root
author:
