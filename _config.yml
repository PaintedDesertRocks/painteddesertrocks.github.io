  GitLab:  painteddesertrocks
  Google-Plus: painteddesertrocks
  Instagram: painteddesertrocks
  LinkedIn: painteddesertrocks
  Twitter:
  Facebook:
  Slack:

# build settings
markdown: kramdown

sass:
  style: compressed

exclude:
  - "*.gemspec"
  - LICENSE.md
  - CONTRIBUTING.md
  - README.md
  - node_modules
  - vendor
  - .github
  - Gemfile
  - Gemfile.lock

