<head>
	<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<!--[if lte IE 8]><script src="{{ "assets/js/ie/html5shiv.js" | relative_url }}"></script><![endif]-->
	<link rel="stylesheet" href="{{ "assets/css/main.css" | relative_url }}" />
	<!--[if lte IE 9]><link rel="stylesheet" href="{{ "assets/css/ie9.css" | relative_url }}" /><![endif]-->
	<!--[if lte IE 8]><link rel="stylesheet" href="{{ "assets/css/ie8.css" | relative_url }}" /><![endif]-->

	<!-- Favicon -->
<link rel="icon" href="/favicon.ico" sizes="any">

<!-- PNG Icons -->
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16.png">

<!-- Apple Touch Icon -->
<link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">

<!-- Safari pinned tab -->
<link rel="mask-icon" href="/assets/images/safari-pinned-tab.svg" color="#ffffff">

<!-- Windows tiles -->
<meta name="msapplication-TileColor" content="#ffffff">
<meta name="msapplication-TileImage" content="/assets/images/mstile-150x150.png">

<!-- Theme color -->
<meta name="theme-color" content="#ffffff">

<!-- Example cookie banner -->
<div id="cookie-banner" style="padding: 15px; background:#eee; position:fixed; bottom:0; width:100%; text-align:center;">
  This site uses cookies for analytics. 
  <button id="accept-cookies">Accept</button>
  <button id="decline-cookies">Decline</button>
</div>
	
{% if jekyll.environment == "production" %}



<script>
  // Check if user has previously made a choice
  const consent = localStorage.getItem("ga_consent");

  if (consent === "accepted") {
    loadGoogleAnalytics();
    document.getElementById("cookie-banner").style.display = "none";
  } else if (consent === "declined") {
    document.getElementById("cookie-banner").style.display = "none";
  }

  // Accept
  document.getElementById("accept-cookies").addEventListener("click", () => {
    localStorage.setItem("ga_consent", "accepted");
    loadGoogleAnalytics();
    document.getElementById("cookie-banner").style.display = "none";
  });

  // Decline
  document.getElementById("decline-cookies").addEventListener("click", () => {
    localStorage.setItem("ga_consent", "declined");
    document.getElementById("cookie-banner").style.display = "none";
  });

  // Function to load GA4 only after consent
  function loadGoogleAnalytics() {
    // GA tag
    let gtagScript = document.createElement("script");
    gtagScript.setAttribute("async", "");
    gtagScript.src = "https://www.googletagmanager.com/gtag/js?id=G-TVT3CTW8LL""; // <-- replace with your GA ID
    document.head.appendChild(gtagScript);

    // GA config
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag('config', 'G-TVT3CTW8LL');
  }
</script>
	
{% endif %}


</head>
